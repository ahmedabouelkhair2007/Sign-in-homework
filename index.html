<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework-2</title>
    <link rel="stylesheet" href="homework2.css">
</head>
<body>
    <!-- Start Forms -->
    <!-- <div class="forms"> -->
    <form action="process.php" method="post">
    <!-- Username -->
     <div class="User">
    <label for="Usename">Username:</label>  
    <input type="text" id="name" name="Username" required minlength="3"><br>
    </div>
    <!-- Email -->
     <div class="Em"></div>
    <label for="Email" id="email">Email:</label>   
    <input type="email" name="Email" class="email" required><br>
    </div>
    <!-- Password -->
    <div class="Pass">
    <label for="Password" id="Password">Password:</label> 
    <input type="password" name="Password" required minlength="8"><br>
    <label for="Password" id="Password">Password Again:</label> 
    <input type="password" name="Password" required minlength="8"><br>
    </div>
    <!-- Gender -->
     <div class="Gen">
    <label for="Gender" id="Gender">Gender:</label>
    <select name="Gender" required class="Gender"><br>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
    </select>
    </div>
    <!-- Date -->
     <div class="dat">
    <label for="Date" id="Date">Date:</label>
    <input type="date" name="date" class="date" required>
    </div>
    <!-- Submit -->
    <div class="ok">
    <Button type="submit" class="submit" required>Submit</Button><br>
    </div>
    </form>
    <!-- </div>     -->
    <!-- End Forms -->
</body>
</html>
